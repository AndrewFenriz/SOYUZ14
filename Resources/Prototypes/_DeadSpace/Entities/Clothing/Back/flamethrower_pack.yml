- type: entity
  parent: [Clothing, ClothingSlotBase]
  id: FlamethrowerPack
  name: огнемётный ранец
  description: Вместительный баллон для огнемёта. Лучший продукт коллаборации NT и SKFC.
  components:
  - type: Tag
    tags:
    - FlamethrowerBackTank
  - type: Sprite
    sprite: _DeadSpace/Clothing/Back/flamethrowertank.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: Clothing
    slots: BACK
    sprite: _DeadSpace/Clothing/Back/flamethrowertank.rsi
  - type: ItemSlots
    slots:
      item:
        priority: 2
        whitelist:
          tags:
          - FlamethrowerNozzle
  - type: SolutionAmmoProvider
    solutionId: tank
    proto: BulletFireShot
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 1000
        reagents:
          - ReagentId: FlamethrowerFuel
            Quantity: 1000
  - type: SolutionTransfer
    transferAmount: 50
    maxTransferAmount: 100
    minTransferAmount: 10
    canChangeTransferAmount: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: DrawableSolution
    solution: tank
  - type: RefillableSolution
    solution: tank
  - type: DrainableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
    exactVolume: true
